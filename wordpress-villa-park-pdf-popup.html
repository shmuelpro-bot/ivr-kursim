<!-- ════════════════════════════════════════════════════
     פופאפ פלייר "וילה על הפארק"
     עולה פעם אחת בלבד לכל מבקר, 10 שניות אחרי כניסתו לאתר.
     מציג רק את תמונת הפלייר עצמה, בלי כיתוב נוסף.
     כתובת התמונה כבר מוגדרת בקוד (מ-maagarim-dirot.co.il).
     פשוט מדביקים את כל הקוד הזה בבלוק HTML באלמנטור.

     "פעם אחת לכל משתמש" ממומש באמצעות localStorage בדפדפן -
     אם המשתמש ינקה נתוני גלישה, הפופאפ יוכל להופיע שוב.
════════════════════════════════════════════════════ -->
<div id="vp-pdf-popup-overlay" class="vp-pdf-overlay" dir="rtl" hidden>
  <div class="vp-pdf-modal" role="dialog" aria-modal="true">
    <button type="button" class="vp-pdf-close" id="vp-pdf-close" aria-label="סגור">✕</button>
    <a href="https://maagarim-dirot.co.il/wp-content/uploads/2026/07/%D7%A4%D7%9C%D7%99%D7%99%D7%A8_%D7%95%D7%99%D7%9C%D7%94_%D7%A2%D7%9C_%D7%94%D7%A4%D7%90%D7%A8%D7%A7_%D7%9E%D7%95%D7%9B%D7%9F_%D7%9C%D7%94%D7%93%D7%A4%D7%A1%D7%94.jpg" target="_blank" rel="noopener">
      <img class="vp-pdf-img" src="https://maagarim-dirot.co.il/wp-content/uploads/2026/07/%D7%A4%D7%9C%D7%99%D7%99%D7%A8_%D7%95%D7%99%D7%9C%D7%94_%D7%A2%D7%9C_%D7%94%D7%A4%D7%90%D7%A8%D7%A7_%D7%9E%D7%95%D7%9B%D7%9F_%D7%9C%D7%94%D7%93%D7%A4%D7%A1%D7%94.jpg" alt="פלייר וילה על הפארק">
    </a>
  </div>
</div>

<style>
.vp-pdf-overlay{position:fixed;inset:0;background:rgba(15,23,42,.7);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px;animation:vp-pdf-fade .25s ease}
.vp-pdf-overlay[hidden]{display:none}
.vp-pdf-modal{position:relative;max-width:420px;width:100%;max-height:90vh}
.vp-pdf-img{display:block;width:100%;height:auto;max-height:90vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.vp-pdf-close{position:absolute;top:-14px;left:-14px;width:32px;height:32px;border:none;border-radius:50%;background:#fff;color:#1e293b;font-size:1rem;cursor:pointer;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.vp-pdf-close:hover{background:#f1f5f9}
@keyframes vp-pdf-fade{from{opacity:0}to{opacity:1}}
</style>

<script>
(function(){
  'use strict';

  // ── הגדרות ─────────────────────────────────
  var DELAY_MS    = 10000; // 10 שניות
  var STORAGE_KEY = 'vpPdfPopupShown_villaPark';

  if (localStorage.getItem(STORAGE_KEY)) return;

  function showPopup(){
    var overlay = document.getElementById('vp-pdf-popup-overlay');

    overlay.hidden = false;
    localStorage.setItem(STORAGE_KEY, '1');

    function close(){ overlay.hidden = true; }
    document.getElementById('vp-pdf-close').addEventListener('click', close);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); }, { once: true });
  }

  setTimeout(showPopup, DELAY_MS);
})();
</script>
