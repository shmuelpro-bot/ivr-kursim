<!-- ════════════════════════════════════════════════════
     פופאפ: דירה להשכרה לבין הזמנים בצפת
     הדבק את כל הקוד הזה בתוך ווידג'ט "HTML" בתבנית הפופאפ באלמנטור
     (Elementor → Popup Builder → הוסף ווידג'ט "HTML" → הדבק כאן)

     ⚠️ לפני שמפרסמים:
     1. העלו לוורדפרס (מדיה → הוספת קובץ חדש) את תמונת הפלייר המלאה
        (זו שבה כל התמונות והטקסט כבר משולבים יחד).
     2. העתיקו את כתובת ה-URL של הקובץ שהועלה.
     3. הדביקו אותה במקום "REPLACE_WITH_FLYER_IMAGE_URL.jpg" למטה.
════════════════════════════════════════════════════ -->
<div class="tzp-wrap" dir="rtl" role="dialog" aria-label="דירה להשכרה לבין הזמנים בצפת">

  <button type="button" class="tzp-close" aria-label="סגירה">✕</button>

  <div class="tzp-hero">
    <img src="REPLACE_WITH_FLYER_IMAGE_URL.jpg" alt="דירה להשכרה לבין הזמנים בצפת" loading="lazy">
  </div>

  <div class="tzp-cta">
    <a href="tel:0547144399" class="tzp-btn tzp-btn-call">📞 0547144399</a>
    <a href="https://wa.me/972547144399" class="tzp-btn tzp-btn-wa" target="_blank" rel="noopener">💬 שליחת וואטסאפ</a>
  </div>
</div>

<style>
.tzp-wrap{position:relative;max-width:420px;margin:0 auto;font-family:Arial,Rubik,sans-serif;direction:rtl;text-align:right;background:#fffdf7;border:2px solid #c9a84c;border-radius:20px;padding:14px 14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.18);box-sizing:border-box}
.tzp-wrap *{box-sizing:border-box}
.tzp-close{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;border:1.5px solid #c9a84c;background:#fff;color:#92400e;font-size:.95rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:2}
.tzp-close:hover{background:#fdf1cf}
.tzp-hero{width:100%;border-radius:14px;overflow:hidden;background:#f1e6c8;margin-bottom:12px}
.tzp-hero img{width:100%;height:auto;display:block}
.tzp-cta{display:flex;gap:10px;flex-wrap:wrap}
.tzp-btn{flex:1;min-width:150px;text-align:center;padding:13px 10px;border-radius:12px;font-weight:800;font-size:1.02rem;text-decoration:none;transition:opacity .15s;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.tzp-btn:hover{opacity:.9}
.tzp-btn-call{background:#c9a84c;color:#fff}
.tzp-btn-wa{background:#25d366;color:#fff}
</style>

<script>
(function(){
  document.querySelectorAll('.tzp-close').forEach(function(btn){
    btn.addEventListener('click', function(){
      if (window.elementorProFrontend && elementorProFrontend.modules && elementorProFrontend.modules.popup) {
        elementorProFrontend.modules.popup.closePopup({}, false);
      } else {
        var wrap = btn.closest('.tzp-wrap');
        if (wrap) wrap.style.display = 'none';
      }
    });
  });
})();
</script>
