// ── API ──────────────────────────────────────────────────────
async function api(action, data={}, timeoutMs=25000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(API, {
      method:  'POST',
      headers: {'Content-Type':'application/json'},
      body:    JSON.stringify({action, token: S.token||'', ...data}),
      signal:  ctrl.signal,
    });
    clearTimeout(tid);
    return await r.json();
  } catch(e) {
    clearTimeout(tid);
    if (timeoutMs < 70000) {
      const el = document.getElementById('mg-status-msg');
      if (el) el.textContent = 'מנסה שוב… ממתין לשרת (עד 60 שנ\')';
      await new Promise(r => setTimeout(r, 2000));
      return api(action, data, 70000);
    }
    return {ok:false, error:'שגיאת תקשורת – נסה שנית'};
  }
}

async function imgToB64(file) {
  return new Promise(res => {
    const canvas = document.createElement('canvas');
    const img    = new Image();
    const url    = URL.createObjectURL(file);
    img.onload = () => {
      const maxW=900, maxH=700;
      let w=img.width, h=img.height;
      const ratio = Math.min(maxW/w, maxH/h, 1);
      w=Math.round(w*ratio); h=Math.round(h*ratio);
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = url;
  });
}

// ── Custom city/neighborhood helpers ─────────────────────────
function saveCustomCities() { localStorage.setItem('mg_custom_cities', JSON.stringify(S.customCities)); }
function saveCustomNhs()    { localStorage.setItem('mg_custom_nhs',    JSON.stringify(S.customNhs));    }

function nextCustomCityId() {
  return S.customCities.length ? Math.max(...S.customCities.map(c=>c.id)) + 1 : 10001;
}
function nextCustomNhId(cityId) {
  const ids = Object.keys(S.customNhs[cityId] || {}).map(Number);
  return ids.length ? Math.max(...ids) + 1 : 10001;
}

function allCitiesOptions(selectedId) {
  const cities = (S.fd || {}).cities || {};
  const builtIn = Object.entries(cities).map(([id,n]) =>
    `<option value="${id}" ${parseInt(id)===selectedId?'selected':''}>${esc(n)}</option>`).join('');
  const custom = S.customCities.map(c =>
    `<option value="${c.id}" ${c.id===selectedId?'selected':''}>${esc(c.name)}</option>`).join('');
  return builtIn + custom + '<option value="add_city">➕ הוסף עיר חדשה...</option>';
}

function nhOptionsForCity(cityId) {
  const builtInNhs = ((S.fd || {}).neighborhoods || {})[cityId] || {};
  const customNhs  = S.customNhs[cityId] || {};
  const builtin = Object.entries(builtInNhs).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');
  const custom  = Object.entries(customNhs).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');
  const addOpt  = cityId ? '<option value="add_nh">➕ הוסף שכונה...</option>' : '';
  return `<option value="0">אופציונלי</option>${builtin}${custom}${addOpt}`;
}

function addCustomCity(prefix) {
  const name = prompt('הקלד שם עיר חדשה:');
  const sel = document.getElementById(prefix + '-city');
  if (!name || !name.trim()) { if (sel) sel.value = ''; return; }
  const trimmed = name.trim();
  let city = S.customCities.find(c => c.name === trimmed);
  if (!city) {
    city = {id: nextCustomCityId(), name: trimmed};
    S.customCities.push(city);
    saveCustomCities();
  }
  if (sel) {
    if (![...sel.options].find(o => parseInt(o.value) === city.id)) {
      const addOpt = [...sel.options].find(o => o.value === 'add_city');
      const opt = document.createElement('option');
      opt.value = city.id; opt.textContent = city.name;
      sel.insertBefore(opt, addOpt);
    }
    sel.value = city.id;
  }
  const nhSel = document.getElementById(prefix + '-nh');
  if (nhSel) nhSel.innerHTML = nhOptionsForCity(city.id);
}

function addCustomNh(prefix) {
  const citySel = document.getElementById(prefix + '-city');
  const cityId  = parseInt(citySel?.value) || 0;
  const nhSel   = document.getElementById(prefix + '-nh');
  if (!cityId) { if (nhSel) nhSel.value = '0'; return; }
  const name = prompt('הקלד שם שכונה חדשה:');
  if (!name || !name.trim()) { if (nhSel) nhSel.value = '0'; return; }
  const trimmed = name.trim();
  if (!S.customNhs[cityId]) S.customNhs[cityId] = {};
  const existing = Object.entries(S.customNhs[cityId]).find(([,n]) => n === trimmed);
  let nhId;
  if (existing) {
    nhId = parseInt(existing[0]);
  } else {
    nhId = nextCustomNhId(cityId);
    S.customNhs[cityId][nhId] = trimmed;
    saveCustomNhs();
  }
  if (nhSel) {
    if (![...nhSel.options].find(o => parseInt(o.value) === nhId)) {
      const addOpt = [...nhSel.options].find(o => o.value === 'add_nh');
      const opt = document.createElement('option');
      opt.value = nhId; opt.textContent = trimmed;
      nhSel.insertBefore(opt, addOpt);
    }
    nhSel.value = nhId;
  }
}

function onCityChange()  {
  if (document.getElementById('mg-city')?.value === 'add_city') { addCustomCity('mg'); return; }
  updateNh();
}
function onCityChangeW() {
  if (document.getElementById('wf-city')?.value === 'add_city') { addCustomCity('wf'); return; }
  updateNhW();
}
function onCityChangeSF() {
  if (document.getElementById('sf-city')?.value === 'add_city') { addCustomCity('sf'); return; }
  updateNhSF();
}
function onNhChange()  { if (document.getElementById('mg-nh')?.value === 'add_nh') addCustomNh('mg'); }
function onNhChangeW() { if (document.getElementById('wf-nh')?.value === 'add_nh') addCustomNh('wf'); }
function onNhChangeSF() { if (document.getElementById('sf-nh')?.value === 'add_nh') addCustomNh('sf'); }

function showListings() {
  if (!S.listingsLoaded) { loadListings(); return; }
  const list = S.listings;
  const fd = S.listFd || {};
  const cityName = a => esc(a.city_name || fd.cities?.[a.city] || String(a.city));
  const typeName = id => esc(fd.apt_types?.[id]    || id);
  const rentName = id => esc(fd.rental_types?.[id] || id);
  const now = Date.now()/1000;

  const cards = list.length === 0
    ? `<div class="mg-empty"><div style="font-size:3rem">🏚️</div><h4>אין פרסומים פעילים</h4>
       <button class="mg-btn mg-btn-primary" onclick="goForm()">פרסם עכשיו</button></div>`
    : list.map(a => {
      const exp  = a.expires > 0 && a.expires < now;
      const img1 = a.images && a.images[0];
      const feats = (a.features||[]).slice(0,5).map(f=>`<span class="mg-badge mg-badge-blue">${FMAP[f]||f}</span>`).join('');
      return `
        <div class="mg-listing">
          <div class="mg-listing-img">${img1?`<img src="${esc(img1)}">`:'🏠'}</div>
          <div class="mg-listing-body">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
              <strong>${cityName(a)}</strong>
              <span class="mg-badge ${exp?'mg-badge-red':'mg-badge-green'}">${exp?'פג תוקף':'פעיל'}</span>
            </div>
            <div style="margin-bottom:6px">
              <span class="mg-badge mg-badge-gray">${typeName(a.apt_type)}</span>
              <span class="mg-badge mg-badge-gray">${a.bedrooms==0?'סטודיו':a.bedrooms+" חד'"}</span>
              <span class="mg-badge mg-badge-gray">${a.beds} 🛏</span>
              ${a.price>0?`<span class="mg-badge" style="background:#fef3c7;color:#92400e">₪${Number(a.price).toLocaleString()}</span>`:''}
            </div>
            ${feats?`<div style="margin-bottom:6px">${feats}</div>`:''}
            ${a.description?`<p style="font-size:.85rem;color:#6b7280;margin:0 0 8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(a.description)}</p>`:''}
            <div style="display:flex;justify-content:space-between;align-items:center">
              <small style="color:#9ca3af">${rentName(a.rental_type)}${a.expires > 0 ? ' · תקף עד ' + new Date(a.expires*1000).toLocaleDateString('he-IL') : ''}</small>
              <button class="mg-btn mg-btn-danger" onclick="doDelete('${esc(a.id)}')">הסר</button>
            </div>
          </div>
        </div>`;
    }).join('');

  render(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">📋 הפרסומים שלי</h3>
      <button class="mg-btn mg-btn-primary" onclick="goForm()">+ פרסם חדש</button>
    </div>
    <button class="mg-back" onclick="goDash()">← חזרה לדשבורד</button>
    ${alert_html()}

  `);
}

function goHome()       { S.error='';S.success='';S.step='home'; if (!S.allLoaded) loadAllListings(); else showHome(); }
function goLogin(to)    { S._afterLogin=to||'form'; S.error='';S.success=''; showLogin(to); }
function goDash()       { S.error='';S.success='';S.step='dashboard'; showDashboard(); }
function goForm()       { S.error='';S.success='';S.step='form'; S.imgs=[]; showForm(); }
function goListings()   { S.error='';S.success='';S.step='listings'; S.listingsLoaded=false; showListings(); }
function goWantedForm() { S.error='';S.success='';S.step='wanted_form'; showWantedForm(); }
function goMyWanted()   { S.error='';S.success='';S.step='my_wanted'; showMyWanted(); }
function goSwapForm()   { S.error='';S.success='';S.step='swap_form'; S.imgs=[]; showSwapForm(); }
function goMySwap()     { S.error='';S.success='';S.step='my_swap'; showMySwap(); }

function setTab(tab) {
  S.tab = tab;
  if (tab === 'wanted' && !S.wantedLoaded) { loadWantedListings(); return; }
  if (tab === 'swap'   && !S.swapLoaded)   { loadSwapListings();   return; }
  showHome();
}

async function loadAllListings() {
  showHome();
  const r = await api('all_listings');
  if (!r.ok) { S.allListings=[]; S.allLoaded=true; S.allFd={}; showHome(); return; }
  S.allListings = r.listings || [];
  S.allFd       = {cities: r.cities, apt_types: r.apt_types, rental_types: r.rental_types};
  S.allLoaded   = true;
  showHome();
}

async function loadWantedListings() {
  showHome();
  const r = await api('all_wanted');
  if (!r.ok) { S.wantedListings=[]; S.wantedLoaded=true; showHome(); return; }
  S.wantedListings = r.listings || [];
  if (!S.allFd) S.allFd = {cities: r.cities, apt_types: r.apt_types, rental_types: r.rental_types};
  S.wantedLoaded = true;
  showHome();
}

async function loadSwapListings() {
  showHome();
  const r = await api('all_swaps');
  if (!r.ok) { S.swapListings=[]; S.swapLoaded=true; showHome(); return; }
  S.swapListings = r.listings || [];
  if (!S.allFd) S.allFd = {cities: r.cities, apt_types: r.apt_types, rental_types: r.rental_types};
  S.swapLoaded = true;
  showHome();
}

async function doPublishWanted() {
  S.error = '';
  const cityVal = document.getElementById('wf-city')?.value;
  if (!cityVal || cityVal === 'add_city') { S.error='נא לבחור עיר'; showWantedForm(); return; }
  const cityId     = parseInt(cityVal) || 0;
  const customCity = S.customCities.find(c => c.id === cityId) || null;
  const nhVal      = document.getElementById('wf-nh')?.value || '0';
  const nhId       = parseInt(nhVal) || 0;
  const customNhName = (nhId >= 10001 && S.customNhs[cityId]) ? (S.customNhs[cityId][nhId] || '') : '';
  const feats = [...document.querySelectorAll('input[name=feat]:checked')].map(i=>i.value);
  render(`<div class="mg-loading">⏳ שולח...<br><span id="mg-status-msg" style="font-size:.82rem;color:#9ca3af"></span></div>`);

// ── Image handling ───────────────────────────────────────────
function addImgs(files) {
  Array.from(files).forEach(f => {
    if (S.imgs.length >= MAX_IMGS) return;
    if (!f.type.startsWith('image/')) return;
    if (f.size > 5*1024*1024) { alert('קובץ גדול מ-5MB: ' + f.name); return; }
    S.imgs.push(f);
  });
  refreshThumbs();
}
function removeImg(i) { S.imgs.splice(i,1); refreshThumbs(); }
function refreshThumbs() {
  const wrap = document.getElementById('mg-thumbs');
  const drop = document.getElementById('mg-drop');
  if (!wrap) return;
  wrap.innerHTML = S.imgs.map((f,i)=>`
    <div class="mg-thumb">
      <img src="${URL.createObjectURL(f)}">
      <button onclick="removeImg(${i})">✕</button>
    </div>`).join('');
  if (drop) drop.style.display = S.imgs.length >= MAX_IMGS ? 'none' : '';
}
