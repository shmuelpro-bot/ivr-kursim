<style>

.mg-btn-primary{background:var(--dark);color:#fff}

.mg-btn-outline{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}
.mg-btn-outline:hover{border-color:var(--dark);background:#f8f5f0}
.mg-btn-danger{background:transparent;color:#b52a1c;border:1px solid #f0c8c4;padding:5px 12px;font-size:.78rem;border-radius:6px;cursor:pointer;transition:all .15s;font-family:inherit}
.mg-btn-danger:hover{background:#fef5f3}

.mg-listing{border:1px solid var(--bd);border-right:3px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:var(--card);transition:box-shadow .2s,transform .2s}

.mg-badge-green{background:var(--gbg);color:var(--g);border-color:var(--gbd)}

textarea.mg-input{min-height:90px;resize:vertical;direction:rtl;text-align:right}

/* Tabs */
.mg-tabs{display:flex;border-bottom:1.5px solid var(--bd);margin-bottom:18px}
.mg-tab{flex:1;padding:11px 6px;border:none;background:none;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--mu);letter-spacing:.3px;transition:all .15s;position:relative;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;font-family:inherit}

/* Warning strip */

/* Ad popup */
#mg-ad-overlay{position:fixed;inset:0;background:rgba(26,26,46,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
#mg-ad-box{background:var(--card);border-radius:16px;max-width:420px;width:100%;padding:28px 24px;direction:rtl;text-align:right;position:relative;box-shadow:0 24px 64px rgba(26,26,46,.25);animation:mg-pop .28s ease;border-top:3px solid var(--gold)}

#mg-ad-close{position:absolute;top:12px;left:14px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--mu);line-height:1;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
#mg-ad-close:hover{background:var(--bd)}
@keyframes mg-bounce{from{transform:translateY(0)}to{transform:translateY(6px)}}
@media(max-width:500px){.mg-feat{grid-template-columns:1fr 1fr}.mg-opt{flex-direction:column}}
</style>

<script>
(function(){
'use strict';

const API      = 'https://maagarim-dirot.co.il/wp-json/maagarim/v1/api';
const TK       = 'mg_token';
const EM       = 'mg_email';
const MAX_IMGS = 4;

const S = {
  step:'home', token:localStorage.getItem(TK)||null, email:localStorage.getItem(EM)||null,
  error:'', success:'', fd:null, listings:[], listingsLoaded:false, imgs:[],
  allListings:[], allLoaded:false, allFd:null, tab:'listings',
  wantedListings:[], wantedLoaded:false, myWanted:[], myWantedLoaded:false,
  filterCity:0, filterRent:0, filterType:0, filterBeds:0, filterFeats:[], showFilters:false,
  customCities:JSON.parse(localStorage.getItem('mg_custom_cities')||'[]'),
  customNhs:JSON.parse(localStorage.getItem('mg_custom_nhs')||'{}'),
  swapListings:[], swapLoaded:false, mySwap:[], mySwapLoaded:false,
};

const FMAP = {
  parking:'🅿️ חניה', ac:'❄️ מיזוג', elevator:'🛗 מעלית', balcony:'🌿 מרפסת',
  wifi:'📶 WiFi', washing:'🫧 כביסה', dishwasher:'🍽️ מדיח', bathtub:'🛁 אמבטיה',
  shabbat_mode:'🕯️ שבת', crib:'👶 עריסה', synagogue:'🕍 ביהכ"נ', garden:'🌳 גינה',
  handicapped:'♿ נגיש', quiet:'🔇 שקט',
  pool:'🏊 בריכה', jacuzzi:'🪣 ג׳קוזי', swings:'🛝 נדנדות', hammock:'🌴 ערסל',
  ping_pong:'🏓 פינג פונג', bouncy_castle:'👦 בימבות', snooker:'🎱 סנוקר',
  table_tennis:'🎾 טניס שולחן'
};

async function api(action, data={}, timeoutMs=25000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action, token:S.token||'', ...data}), signal:ctrl.signal,
    });
    clearTimeout(tid);
    return await r.json();
  } catch(e) {
    clearTimeout(tid);
    if (timeoutMs < 70000) {
      const el = document.getElementById('mg-status-msg');
      if (el) el.textContent = 'מנסה שוב…';
      await new Promise(r => setTimeout(r, 2000));
      return api(action, data, 70000);
    }
    return {ok:false, error:'שגיאת תקשורת – נסה שנית'};
  }
}

async function imgToB64(file) {
  return new Promise(res => {
    const canvas = document.createElement('canvas');
    const img    = new Image();
    const url    = URL.createObjectURL(file);
    img.onload = () => {
      const maxW=900, maxH=700;
      let w=img.width, h=img.height;
      const ratio = Math.min(maxW/w, maxH/h, 1);
      w=Math.round(w*ratio); h=Math.round(h*ratio);
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = url;
  });
}

function render(html) { document.getElementById('mg-app').innerHTML = html; }
function esc(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }
function alert_html() {
  let h='<span id="mg-status-msg" style="display:block;color:var(--mu);font-size:.82rem;text-align:center;min-height:1.1em;margin-bottom:4px"></span>';
  if (S.error)   h+=`<div class="mg-alert mg-alert-err">⚠ ${esc(S.error)}</div>`;
  if (S.success) h+=`<div class="mg-alert mg-alert-ok">✓ ${esc(S.success)}</div>`;
  return h;
}

/* ── card helpers ── */
function addrLine(a) {
  const nh = a.neighborhood_name || '';
  const parts = [nh, a.street, a.building_num ? 'מס׳ '+a.building_num : ''].filter(Boolean);
  if (!parts.length && !a.floor) return '';
  const txt = parts.length ? esc(parts.join(' · ')) : '';
  const floor = a.floor ? (parts.length ? ' · קומה ' : 'קומה ') + esc(a.floor) : '';
  return `<div style="font-size:.79rem;color:#8a8075;margin:4px 0 8px">📍 ${txt}${floor}</div>`;
}
function contactBlock(a, bgColor, bdColor, linkColor) {
  const ph = a.contact_phone ? `<a href="tel:${esc(a.contact_phone)}" style="color:${linkColor};font-weight:700;text-decoration:none;font-size:.87rem">📞 ${esc(a.contact_phone)}</a>` : '';
  const em = a.contact_email ? `<a href="mailto:${esc(a.contact_email)}" style="color:${linkColor};font-weight:600;text-decoration:none;font-size:.82rem">${esc(a.contact_email)}</a>` : '';
  const parts = [ph, em].filter(Boolean);
  if (!parts.length) return '';
  return `<div style="margin-top:10px;padding:10px 14px;background:${bgColor};border:1px solid ${bdColor};border-radius:8px;display:flex;align-items:center;flex-wrap:wrap;gap:8px">
    ${a.contact_name?`<span style="font-size:.78rem;color:#8a8075;font-weight:600">${esc(a.contact_name)}</span><span style="color:${bdColor}">·</span>`:''}
    ${parts.join(`<span style="color:${bdColor}">·</span>`)}
  </div>`;
}
const WARN = `<div class="mg-warn">⚠️ חובה ליידע את המפרסם שהגעת דרך <strong>אתר מאגרים</strong></div>`;

/* ── Public apartment card ── */
function aptCard(a, fd) {
  const city    = a.city_name || fd.cities?.[a.city] || String(a.city);
  const type    = fd.apt_types?.[a.apt_type]    || '';
  const rent    = fd.rental_types?.[a.rental_type] || '';
  const img1    = a.images?.[0];
  const feats   = (a.features||[]).map(f=>`<span class="mg-badge mg-badge-blue">${FMAP[f]||f}</span>`).join('');
  const price   = a.price > 0 ? `<div style="font-size:1rem;font-weight:700;color:#c8a256;margin-top:3px">₪${Number(a.price).toLocaleString()}<span style="font-size:.68rem;color:#8a8075;font-weight:400"> ל-24ש'</span></div>` : '';
  const rooms   = a.bedrooms==0 ? 'סטודיו' : a.bedrooms+' חדרי שינה';
  const bedsLbl = a.beds==1 ? 'מיטה 1' : a.beds+' מיטות';
  return `
    <div class="mg-listing" style="border-right-color:#1a5c40">
      <div class="mg-listing-img">${img1?`<img src="${esc(img1)}" loading="lazy">`:'<span style="color:#c0bbb4">🏠</span>'}</div>
      <div class="mg-listing-body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
          <div style="flex:1">
            <div style="font-size:1.12rem;font-weight:700;color:#1a1a2e;letter-spacing:.2px">${esc(city)}</div>
            <div style="font-size:.76rem;color:#8a8075;margin-top:3px">${[type,rent].filter(Boolean).map(esc).join(' · ')}</div>
          </div>
          <div style="text-align:left;flex-shrink:0;padding-right:8px">
            ${price}
            <div style="margin-top:6px;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              <span style="font-size:.92rem;font-weight:700;color:#1a1a2e">🛏 ${bedsLbl}</span>
              <span style="font-size:.82rem;font-weight:600;color:#1a5c40">🚪 ${rooms}</span>
            </div>
          </div>
        </div>
        ${addrLine(a)}
        ${feats?`<div style="margin:6px 0;line-height:1.9">${feats}</div>`:''}
        ${a.description?`<p style="font-size:.82rem;color:#8a8075;margin:5px 0;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(a.description)}</p>`:''}
        ${contactBlock(a,'#f0f7f3','#b8ddd0','#1a5c40')}
        ${WARN}
      </div>
    </div>`;
}

/* ── Wanted card ── */
function wantedCard(a, fd) {
  const city    = a.city_name || fd.cities?.[a.city] || String(a.city);
  const type    = fd.apt_types?.[a.apt_type]    || '';
  const rent    = fd.rental_types?.[a.rental_type] || '';
  const feats   = (a.features||[]).map(f=>`<span class="mg-badge mg-badge-blue">${FMAP[f]||f}</span>`).join('');
  const rooms   = a.bedrooms==0 ? 'ללא דרישה' : 'מינ׳ '+a.bedrooms+' חדרי שינה';
  return `
    <div class="mg-listing" style="border-right-color:#1a3a6c">
      <div style="padding:7px 18px;background:#f0f4fa;border-bottom:1px solid #ddd8d0">
        <span style="font-size:.68rem;font-weight:700;color:#1a3a6c;letter-spacing:.6px;text-transform:uppercase">🔍 ביקוש דירה</span>
      </div>
      <div class="mg-listing-body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
          <div>
            <div style="font-size:1.12rem;font-weight:700;color:#1a1a2e">${esc(city)}</div>
            <div style="font-size:.76rem;color:#8a8075;margin-top:3px">${[type?'מעדיף: '+type:'',rent].filter(Boolean).map(esc).join(' · ')}</div>
          </div>
          <div style="text-align:left;flex-shrink:0">
            ${a.price>0?`<div style="font-size:1rem;font-weight:700;color:#c8a256">עד ₪${Number(a.price).toLocaleString()}</div>`:''}
            <div style="margin-top:6px;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              <span style="font-size:.92rem;font-weight:700;color:#1a1a2e">🛏 מינ׳ ${a.beds} מיטות</span>
              <span style="font-size:.82rem;font-weight:600;color:#1a3a6c">🚪 ${rooms}</span>
            </div>
          </div>
        </div>
        ${feats?`<div style="margin:6px 0;line-height:1.9">${feats}</div>`:''}
        ${a.description?`<p style="font-size:.82rem;color:#8a8075;margin:5px 0;line-height:1.6">${esc(a.description)}</p>`:''}
        ${contactBlock(a,'#f0f4fa','#c0d0e8','#1a3a6c')}
        ${WARN}
      </div>
    </div>`;
}

/* ── Swap card ── */
function swapCard(a, fd) {
  const city    = a.city_name || fd.cities?.[a.city] || String(a.city);
  const type    = fd.apt_types?.[a.apt_type] || '';
  const img1    = a.images?.[0];
  const feats   = (a.features||[]).map(f=>`<span class="mg-badge mg-badge-blue">${FMAP[f]||f}</span>`).join('');
  const rooms   = a.bedrooms==0 ? 'סטודיו' : a.bedrooms+' חדרי שינה';
  const bedsLbl = a.beds==1 ? 'מיטה 1' : a.beds+' מיטות';
  return `

/* ── Custom city/NH ── */
function saveCustomCities() { localStorage.setItem('mg_custom_cities', JSON.stringify(S.customCities)); }
function saveCustomNhs()    { localStorage.setItem('mg_custom_nhs',    JSON.stringify(S.customNhs));    }
function nextCustomCityId() { return S.customCities.length ? Math.max(...S.customCities.map(c=>c.id))+1 : 10001; }
function nextCustomNhId(cid){ const ids=Object.keys(S.customNhs[cid]||{}).map(Number); return ids.length?Math.max(...ids)+1:10001; }

function allCitiesDatalist(dlId) {
  const fd = S.fd || S.allFd || {};
  const bi = Object.values(fd.cities||{}).map(n=>`<option value="${esc(n)}">`).join('');
  const cu = S.customCities.map(c=>`<option value="${esc(c.name)}">`).join('');
  return `<datalist id="${dlId}">${bi}${cu}</datalist>`;
}

function updateNhDatalist(prefix) {
  const cityVal = (document.getElementById(prefix+'-city')?.value||'').trim();
  const dl = document.getElementById(prefix+'-nh-dl');
  if (!dl) return;
  const fd = S.fd || S.allFd || {};
  const entry = Object.entries(fd.cities||{}).find(([,n])=>n===cityVal);
  const builtInId = entry ? parseInt(entry[0]) : 0;
  const customCity = S.customCities.find(c=>c.name===cityVal);
  const cityId = builtInId || (customCity?.id||0);
  const bi = (fd.neighborhoods||{})[cityId]||{};
  const cu = S.customNhs[cityId]||{};
  dl.innerHTML = [...Object.values(bi),...Object.values(cu)].map(n=>`<option value="${esc(n)}">`).join('');
}

function resolveCityByName(name) {
  const trimmed = (name||'').trim();
  if (!trimmed) return {cityId:0, cityName:'', customCity:null};
  const fd = S.fd || S.allFd || {};
  const entry = Object.entries(fd.cities||{}).find(([,n])=>n===trimmed);
  if (entry) return {cityId:parseInt(entry[0]), cityName:'', customCity:null};
  let city = S.customCities.find(c=>c.name===trimmed);
  if (!city) { city={id:nextCustomCityId(),name:trimmed}; S.customCities.push(city); saveCustomCities(); }
  return {cityId:0, cityName:city.name, customCity:city};
}

function resolveNhByName(cityId, name) {
  const trimmed = (name||'').trim();
  if (!trimmed || !cityId) return {nhId:0, nhName:''};
  const bi = ((S.fd||{}).neighborhoods||{})[cityId]||{};
  const entry = Object.entries(bi).find(([,n])=>n===trimmed);
  if (entry) return {nhId:parseInt(entry[0]), nhName:''};
  const cu = S.customNhs[cityId]||{};
  const exist = Object.entries(cu).find(([,n])=>n===trimmed);
  if (exist) return {nhId:0, nhName:trimmed};
  const nhId = nextCustomNhId(cityId);
  if (!S.customNhs[cityId]) S.customNhs[cityId]={};
  S.customNhs[cityId][nhId]=trimmed;
  saveCustomNhs();
  return {nhId:0, nhName:trimmed};
}

function showListings() {
  if(!S.listingsLoaded){ loadListings(); return; }
  const list=S.listings;
  const fd=S.listFd||{};
  const cN = a => esc(a.city_name||fd.cities?.[a.city]||String(a.city));
  const tN = id => esc(fd.apt_types?.[id]||id);
  const rN = id => esc(fd.rental_types?.[id]||id);
  const now=Date.now()/1000;
  const cards = list.length===0
    ? `<div class="mg-empty"><div style="font-size:2.4rem;margin-bottom:12px">🏚️</div><div style="font-weight:700;color:#1a1a2e;margin-bottom:10px">אין פרסומים פעילים</div>
       <button class="mg-btn mg-btn-primary" onclick="goForm()">פרסם עכשיו</button></div>`
    : list.map(a => {
      const exp=a.expires>0&&a.expires<now;
      const img1=a.images?.[0];
      const feats=(a.features||[]).slice(0,5).map(f=>`<span class="mg-badge mg-badge-blue">${FMAP[f]||f}</span>`).join('');
      return `
        <div class="mg-listing">
          <div class="mg-listing-img">${img1?`<img src="${esc(img1)}">`:'<span style="color:#c0bbb4">🏠</span>'}</div>
          <div class="mg-listing-body">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
              <strong style="font-size:1.05rem">${cN(a)}</strong>
              <div style="display:inline-flex;align-items:center;gap:5px">
                <span style="width:6px;height:6px;border-radius:50%;background:${exp?'#b52a1c':'#1a5c40'}"></span>
                <span style="font-size:.75rem;font-weight:600;color:${exp?'#b52a1c':'#1a5c40'}">${exp?'פג תוקף':'פעיל'}</span>
              </div>
            </div>
            <div style="margin-bottom:6px">
              <span class="mg-badge mg-badge-gray">${tN(a.apt_type)}</span>
              <span class="mg-badge mg-badge-gray">${a.bedrooms==0?'סטודיו':a.bedrooms+" חד'"}</span>
              <span class="mg-badge mg-badge-gray">${a.beds} 🛏</span>
              ${a.price>0?`<span class="mg-badge mg-badge-gold">₪${Number(a.price).toLocaleString()}</span>`:''}
            </div>
            ${feats?`<div style="margin-bottom:7px">${feats}</div>`:''}
            ${a.description?`<p style="font-size:.82rem;color:#8a8075;margin:0 0 8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(a.description)}</p>`:''}
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #f0ede7">
              <small style="color:#b0a898">${rN(a.rental_type)}${a.expires>0?' · תקף עד '+new Date(a.expires*1000).toLocaleDateString('he-IL'):''}</small>
              <button class="mg-btn mg-btn-danger" onclick="doDelete('${esc(a.id)}')">הסר</button>
            </div>
          </div>
        </div>`;
    }).join('');
  render(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:1.05rem;font-weight:700;color:#1a1a2e">הפרסומים שלי</div>

    </div>

    ${alert_html()}${cards}
  `);
}

function goHome()       { S.error='';S.success='';S.step='home'; if(!S.allLoaded) loadAllListings(); else showHome(); }
function goLogin(to)    { S._afterLogin=to||'form';S.error='';S.success=''; showLogin(to); }
function goDash()       { S.error='';S.success='';S.step='dashboard'; showDashboard(); }
function goForm()       { S.error='';S.success='';S.step='form';S.imgs=[]; showForm(); }
function goListings()   { S.error='';S.success='';S.step='listings';S.listingsLoaded=false; showListings(); }
function goWantedForm() { S.error='';S.success='';S.step='wanted_form'; showWantedForm(); }
function goMyWanted()   { S.error='';S.success='';S.step='my_wanted'; showMyWanted(); }
function goSwapForm()   { S.error='';S.success='';S.step='swap_form';S.imgs=[]; showSwapForm(); }
function goMySwap()     { S.error='';S.success='';S.step='my_swap'; showMySwap(); }

function setTab(tab) {
  S.tab=tab;
  if(tab==='wanted'&&!S.wantedLoaded){ loadWantedListings(); return; }
  if(tab==='swap'  &&!S.swapLoaded)  { loadSwapListings();   return; }
  showHome();
}

async function loadAllListings() {
  showHome();
  const r=await api('all_listings');
  if(!r.ok){ S.allListings=[];S.allLoaded=true;S.allFd={}; showHome(); return; }
  S.allListings=r.listings||[];
  S.allFd={cities:r.cities,apt_types:r.apt_types,rental_types:r.rental_types};
  S.allLoaded=true; showHome();
}

async function loadWantedListings() {
  showHome();
  const r=await api('all_wanted');
  if(!r.ok){ S.wantedListings=[];S.wantedLoaded=true; showHome(); return; }
  S.wantedListings=r.listings||[];
  if(!S.allFd) S.allFd={cities:r.cities,apt_types:r.apt_types,rental_types:r.rental_types};
  S.wantedLoaded=true; showHome();
}

async function loadSwapListings() {
  showHome();
  const r=await api('all_swaps');
  if(!r.ok){ S.swapListings=[];S.swapLoaded=true; showHome(); return; }
  S.swapListings=r.listings||[];
  if(!S.allFd) S.allFd={cities:r.cities,apt_types:r.apt_types,rental_types:r.rental_types};
  S.swapLoaded=true; showHome();
}

async function doEmailLogin() {
  const inp=document.getElementById('mg-email-in');
  const em=inp?inp.value.trim().toLowerCase():'';
  S.error='';
  if(!em||!em.includes('@')||!em.includes('.')){ S.error='נא להזין כתובת אימייל תקינה'; showLogin(); return; }
  render(`<div class="mg-loading">מתחבר…<br><span id="mg-status-msg" style="font-size:.8rem"></span></div>`);
  const r=await api('email_login',{email:em});
  if(!r.ok){ S.error=r.error; showLogin(); return; }
  S.token=r.token; S.email=r.email;
  localStorage.setItem(TK,r.token); localStorage.setItem(EM,r.email);
  S.success='ברוך הבא!';
  if(S._afterLogin==='listings')          goListings();
  else if(S._afterLogin==='wanted_form')  goWantedForm();
  else if(S._afterLogin==='swap_form')    goSwapForm();
  else goDash();
}

function doLogout() {

function addImgs(files) {
  Array.from(files).forEach(f=>{
    if(S.imgs.length>=MAX_IMGS) return;
    if(!f.type.startsWith('image/')) return;
    if(f.size>5*1024*1024){ alert('קובץ גדול מ-5MB: '+f.name); return; }
    S.imgs.push(f);
  });
  refreshThumbs();
}
function removeImg(i){ S.imgs.splice(i,1); refreshThumbs(); }
function refreshThumbs() {
  const wrap=document.getElementById('mg-thumbs');
  const drop=document.getElementById('mg-drop');
  if(!wrap) return;
  wrap.innerHTML=S.imgs.map((f,i)=>`
    <div class="mg-thumb">
      <img src="${URL.createObjectURL(f)}">
      <button onclick="removeImg(${i})">✕</button>
    </div>`).join('');
  if(drop) drop.style.display=S.imgs.length>=MAX_IMGS?'none':'';
}
